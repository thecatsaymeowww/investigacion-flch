# Cabeceras hacia la aplicación (subfase 4b; punto 4.4 del plan). Contenedor `nginx` de docker-compose.prod.yml.
# Se incluye en CADA `location` que hace `proxy_pass` (ubicaciones.conf): en Nginx, un `proxy_set_header` en una
# location anula todos los heredados, así que el bloque va completo en cada una.
#
# Se SOBRESCRIBEN, nunca se añaden: lo que el cliente envíe en estas cabeceras no llega a la aplicación.
#   X-Real-IP        la IP que ve Nginx: la única que usa la aplicación (lib/limite-envios.ts, con CONFIAR_EN_PROXY=1).
#   X-Forwarded-For  la misma IP, sola (no `$proxy_add_x_forwarded_for`, que conserva la lista del cliente).
#   X-Forwarded-Host y Forwarded  fijados o vaciados: Next compara el Origin de las Server Actions con el host reenviado.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Forwarded         "";
