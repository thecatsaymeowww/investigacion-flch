# Nginx de producción (contenedor `nginx` de docker-compose.prod.yml). Solo carga la configuración de la plataforma:
# no incluye el default.conf de la imagen.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include /etc/nginx/plataforma/limites.conf;
    include /etc/nginx/plataforma/upstream.conf;
    # Generado al arrancar desde sitio.conf.template (envsubst de la imagen, con PUBLIC_SITE_DOMAIN).
    include /etc/nginx/conf.d/sitio.conf;
}
