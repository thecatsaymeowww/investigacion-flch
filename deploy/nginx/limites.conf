# Límites de peticiones de la plataforma (subfase 4b; puntos 4.4 y 5.4 del plan).
# Se incluye en el contexto `http` (deploy/nginx/nginx.conf, contenedor `nginx` de docker-compose.prod.yml) y se usa
# desde ubicaciones.conf (contexto `server`).
#
# TASAS: PROPUESTA SIN CALIBRAR. El plan fija el límite de la aplicación (5 envíos por hora por IP y grupo, 3 intentos
# por minuto por IP: app/(sitio)/[grupo]/acciones.ts), no estas cifras. Las de aquí son una red por encima de ese límite,
# para cortar ráfagas antes de que lleguen a la aplicación. Revisarlas con TI antes de publicar: detrás de un NAT
# institucional muchas personas comparten IP (riesgo de la fila 4b).
#
# La clave es `$binary_remote_addr`, la IP que ve Nginx. Si delante hubiera otro proxy o balanceador, sería la suya
# para todos: hay que configurar antes `set_real_ip_from` con sus direcciones (decisión de TI pendiente, D10).

# Server Actions públicas: POST con cabecera `Next-Action` (el formulario «Colaborar»). Una clave vacía no se limita, así
# que las páginas (GET) y cualquier otro POST no cuentan para esta zona.
map "$request_method:$http_next_action" $limite_accion {
    default      "";
    "~^POST:.+$" $binary_remote_addr;
}

# Inicio de sesión y recuperación: solo cuentan los POST.
map $request_method $limite_post {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $limite_accion      zone=acciones:10m     rate=10r/m;
limit_req_zone $limite_post        zone=login:10m        rate=10r/m;
limit_req_zone $limite_post        zone=recuperacion:10m rate=3r/m;
# Panel, REST autenticada y subidas: amplio (el panel hace muchas peticiones al cargar).
limit_req_zone $binary_remote_addr zone=panel:10m        rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

# Al superar un límite: 429 (no el 503 por defecto), y un aviso en el registro. El aviso solo se escribe si el
# `error_log` del servidor tiene nivel `warn` o inferior (el nivel por defecto, `error`, no lo muestra).
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
