# Rutas de la plataforma y su límite (subfase 4b; punto 5.4 del plan). PLANTILLA: no está desplegada.
# Contexto `server` del sitio (HTTPS, server_name, certificado, HSTS y client_max_body_size son de la subfase 6c):
#   server { …; include plataforma/ubicaciones.conf; }
# Requiere limites.conf, upstream.conf y cabeceras-proxy.conf en /etc/nginx/plataforma/.
# Las tasas y ráfagas son la PROPUESTA de limites.conf, sin calibrar.

# Conexiones simultáneas por IP.
limit_conn conexiones 30;

# Inicio de sesión del panel (Payload también bloquea la cuenta tras 5 fallos).
location = /api/usuarios/login {
    limit_req zone=login burst=5 nodelay;
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}

# Recuperación de contraseña.
location ~ ^/api/usuarios/(forgot-password|reset-password)$ {
    limit_req zone=recuperacion burst=3 nodelay;
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}

# Panel y REST (incluidas las subidas y /api/media/file/): zona amplia propia. Las Server Actions del panel van aquí,
# no a la zona `acciones`, que solo es para las rutas públicas.
location /admin {
    limit_req zone=panel burst=100 nodelay;
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}
location /api/ {
    limit_req zone=panel burst=100 nodelay;
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}

# Recursos estáticos del build: sin límite de peticiones.
location /_next/static/ {
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}

# Sitio público: solo cuentan las Server Actions (POST con Next-Action, el formulario «Colaborar»); las páginas no.
location / {
    limit_req zone=acciones burst=5 nodelay;
    include plataforma/cabeceras-proxy.conf;
    proxy_pass http://plataforma;
}
