# La aplicación (subfase 4b). PLANTILLA: no está desplegada. Contexto `http`.
# Escucha SOLO en 127.0.0.1 (`next start -H 127.0.0.1`, package.json): el único cliente posible es este Nginx de la
# misma máquina. En eso se basa CONFIAR_EN_PROXY=1 (lib/entorno.ts): si la aplicación fuera accesible por otra vía,
# cualquiera podría enviarle su propio X-Real-IP.
upstream plataforma {
    server 127.0.0.1:3000;
}
