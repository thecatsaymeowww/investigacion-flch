# La aplicación (subfase 4b). Contexto `http`. En producción la usa el contenedor `nginx` de docker-compose.prod.yml.
# La app escucha en el puerto 3000 de la red interna de Docker y NO se publica en la máquina: el único cliente posible es
# este Nginx. En eso se basa CONFIAR_EN_PROXY=1 (lib/entorno.ts): si la aplicación fuera accesible por otra vía,
# cualquiera podría enviarle su propio X-Real-IP.
# `resolve` con el DNS interno de Docker: si el contenedor `app` se recrea y cambia de IP, Nginx la sigue sin reiniciarse.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream plataforma {
    zone plataforma 64k;
    server app:3000 resolve;
}
